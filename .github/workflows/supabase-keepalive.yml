name: Supabase Keepalive
on:
  schedule:
    - cron: '0 0 */6 * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret length
        run: |
          echo "MistAI key length: ${#MISTAI_KEY}"
        env:
          MISTAI_KEY: ${{ secrets.SUPABASE_MISTAI_ANON_KEY }}

      - name: Ping MistAI Key System
        run: |
          curl -sf -o /dev/null -w "MistAI: %{http_code}\n" \
            "https://cynsmxhjchcjcjivnkte.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_MISTAI_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_MISTAI_ANON_KEY }}"
      - name: Ping Digital Taboo
        run: |
          curl -sf -o /dev/null -w "Digital Taboo: %{http_code}\n" \
            "https://yiacjatoobjbozopxjvq.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_DIGITALTABOO_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DIGITALTABOO_ANON_KEY }}"
      - name: Ping HoopPortal
        run: |
          curl -sf -o /dev/null -w "HoopPortal: %{http_code}\n" \
            "https://hpuikheuntquldqdewbr.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_HOOPPORTAL_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_HOOPPORTAL_ANON_KEY }}"