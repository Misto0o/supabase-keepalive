name: Supabase Keepalive

on:
  schedule:
    # Every 5 days at 00:00 UTC (buffer before Supabase's 7-day pause)
    - cron: '0 0 */5 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MistAI Key System
        continue-on-error: true
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w "MistAI: %{http_code}\n" \
            "https://cynsmxhjchcjcjivnkte.supabase.co/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_MISTAI_ANON_KEY }}"

      - name: Ping Digital Taboo
        continue-on-error: true
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w "Digital Taboo: %{http_code}\n" \
            "https://yiacjatoobjbozopxjvq.supabase.co/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_DIGITALTABOO_ANON_KEY }}"

      - name: Ping HoopPortal
        continue-on-error: true
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w "HoopPortal: %{http_code}\n" \
            "https://hpuikheuntquldqdewbr.supabase.co/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_HOOPPORTAL_ANON_KEY }}"